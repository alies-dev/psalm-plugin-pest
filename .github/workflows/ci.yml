name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, to catch Psalm master and Pest releases that break the plugin.
    - cron: "0 6 * * 5"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} | Psalm ${{ matrix.psalm }} | Pest ${{ matrix.pest }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        # 7.x-dev is vimeo/psalm master (branch alias), the first Psalm 7 with @param-closure-this.
        psalm: ['^6.19', '7.0.0-beta22', '7.x-dev']
        pest: ['^4.0']
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        env:
          PSALM_VERSION: ${{ matrix.psalm }}
          PEST_VERSION: ${{ matrix.pest }}
        run: >-
          composer update --with="vimeo/psalm:$PSALM_VERSION" --with="pestphp/pest:$PEST_VERSION"
          --with-all-dependencies --no-interaction --no-progress --prefer-dist

      - name: Unit tests
        run: composer test:unit

      - name: Type tests
        run: composer test:type

      # Self-analysis runs per Psalm version: purity rules differ between majors.
      - name: Psalm self-analysis
        run: vendor/bin/psalm --no-cache --no-progress

  style:
    name: Coding style
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: PHP-CS-Fixer
        run: composer cs:check

      - name: Rector
        run: vendor/bin/rector --dry-run --no-progress-bar
