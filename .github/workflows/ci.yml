name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, to catch Psalm master and Pest releases that break the plugin.
    - cron: "0 6 * * 5"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} | Pest ${{ matrix.pest }} | ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Highest: the lowest and highest supported PHP only; 8.4 adds runner time, not coverage. Pest 5 requires PHP 8.4.
          - { php: '8.3', pest: '^4.5', dependencies: highest }
          - { php: '8.5', pest: '^4.5', dependencies: highest }
          - { php: '8.5', pest: '^5.1', dependencies: highest, shepherd: true }
          # Lowest: the declared minimums, each on the lowest PHP its Pest major runs on. The lowest releases of some of
          # Psalm's own dependencies emit PHP 8.4 deprecations, which Psalm turns into crashes: `floors` lifts just those.
          - { php: '8.3', pest: '^4.5', dependencies: lowest }
          - php: '8.4'
            pest: '^5.1'
            dependencies: lowest
            floors: >-
              amphp/cache:>=2.0.1 amphp/dns:>=2.1.2 amphp/parser:>=1.1.1 amphp/process:>=2.0.3 amphp/socket:>=2.3.1
              daverandom/libdns:>=2.1.0 spatie/array-to-xml:>=3.3.0
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        env:
          PEST_VERSION: ${{ matrix.pest }}
          DEPENDENCIES: ${{ matrix.dependencies }}
          FLOORS: ${{ matrix.floors }}
        run: |
          args=(--with="pestphp/pest:$PEST_VERSION")
          if [ "$DEPENDENCIES" = lowest ]; then args+=(--prefer-lowest); fi
          for floor in $FLOORS; do args+=("--with=$floor"); done
          composer update "${args[@]}" --with-all-dependencies --no-interaction --no-progress --prefer-dist

      - name: Unit tests
        run: composer test:unit

      - name: Type tests
        run: composer test:type

      - name: Psalm self-analysis
        env:
          # Report to shepherd.dev (README badges) from one matrix entry only.
          PSALM_SHEPHERD: ${{ matrix.shepherd && '1' || '' }}
        run: vendor/bin/psalm --no-cache --no-progress

  style:
    name: Coding style
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: PHP-CS-Fixer
        run: composer cs:check

      - name: Rector
        run: vendor/bin/rector --dry-run --no-progress-bar
